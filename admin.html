<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Martín Marzorati Portfolio</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="admin-body">
    <header>
        <div class="container">
            <h1>Admin Panel</h1>
            <p>Manage your resume versions and content.</p>
        </div>
    </header>

    <div class="admin-container">
        <!-- Left Column: Versions & Settings -->
        <aside class="admin-sidebar">
            <section id="versions-manager" class="sidebar-section">
                <h2>Resume Versions</h2>
                <div class="add-version-form" style="margin-bottom: 20px;">
                    <input type="text" id="new-version-name" placeholder="Create new version...">
                    <button id="add-version-btn" class="btn-primary">Add</button>
                </div>
                <ul id="versions-list"></ul>
            </section>

            <section id="version-settings-manager" class="sidebar-section hidden">
                <form id="version-settings-form">
                    <div class="settings-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                        <h3 style="margin: 0;">Settings for <span id="current-version-name"></span></h3>
                        <button type="submit" class="btn-primary" style="padding: 8px 15px;">Save All</button>
                    </div>

                    <h4>Contact Information (Global)</h4>
                    <div class="form-grid" style="margin-bottom: 20px;">
                        <input type="text" id="contact-name" name="name" placeholder="Your Name">
                        <input type="email" id="contact-email" name="email" placeholder="Email">
                        <input type="tel" id="contact-phone" name="phone" placeholder="Phone">
                        <input type="url" id="contact-linkedin" name="linkedin" placeholder="LinkedIn URL">
                        <input type="url" id="contact-github" name="github" placeholder="GitHub URL">
                        <input type="url" id="contact-website" name="website" placeholder="Website URL">
                    </div>

                    <div class="settings-tabs">
                        <div class="settings-grid bilingual-titles">
                            <div class="lang-col">
                                <h4>English Titles</h4>
                                <input type="text" data-field="title_summary" placeholder="Summary Title (EN)">
                                <input type="text" data-field="title_experience" placeholder="Experience Title (EN)">
                                <input type="text" data-field="title_education" placeholder="Education Title (EN)">
                                <input type="text" data-field="title_projects" placeholder="Projects Title (EN)">
                                <input type="text" data-field="title_skills" placeholder="Skills Title (EN)">
                                <input type="text" id="contact-subtitle" name="subtitle" placeholder="Subtitle (EN)">
                            </div>
                            <div class="lang-col">
                                <h4>Spanish Titles</h4>
                                <input type="text" data-field="title_summary_es" placeholder="Resumen (ES)">
                                <input type="text" data-field="title_experience_es" placeholder="Experiencia (ES)">
                                <input type="text" data-field="title_education_es" placeholder="Educación (ES)">
                                <input type="text" data-field="title_projects_es" placeholder="Proyectos (ES)">
                                <input type="text" data-field="title_skills_es" placeholder="Habilidades (ES)">
                                <input type="text" id="contact-subtitle_es" name="subtitle_es" placeholder="Subtítulo (ES)">
                            </div>
                        </div>
                    </div>

                    <h4>Section Visibility</h4>
                    <div class="form-grid" style="grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px;">
                        <label><input type="checkbox" data-field="show_summary"> Summary</label>
                        <label><input type="checkbox" data-field="show_experience"> Experience</label>
                        <label><input type="checkbox" data-field="show_education"> Education</label>
                        <label><input type="checkbox" data-field="show_projects"> Projects</label>
                        <label><input type="checkbox" data-field="show_skills"> Skills</label>
                    </div>

                    <label for="contact-profile-pic">Profile Picture:</label>
                    <input type="file" id="contact-profile-pic" accept="image/*">
                    <div id="current-profile-pic-preview"></div>
                </form>
            </section>
        </aside>

        <!-- Right Column: Content Pools -->
        <main class="admin-main-content">
            <div class="content-tabs">
                <button class="tab-link active" data-tab="experience">Experience</button>
                <button class="tab-link" data-tab="education">Education</button>
                <button class="tab-link" data-tab="project">Projects</button>
                <button class="tab-link" data-tab="skill">Skills</button>
                <button class="tab-link" data-tab="summary">Summary</button>
            </div>

            <div id="content-pool-container">
                <!-- Content for each tab will be dynamically inserted here -->
            </div>
        </main>
    </div>

    <!-- Modal for Adding/Editing Content Pool Items -->
    <div id="item-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h2 id="modal-title"></h2>
            <form id="modal-form"></form>
            <div class="modal-actions">
                <button id="modal-save-btn" class="btn-primary">Save</button>
                <button id="modal-cancel-btn" class="btn-secondary">Cancel</button>
            </div>
        </div>
    </div>

    <script src="admin-dashboard.js"></script>
</body>
</html>
