<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Martín Marzorati Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script>
        const saved = localStorage.getItem('theme-mode');
        if (saved === 'light') document.documentElement.classList.add('light-mode');
    </script>
</head>
<body class="admin-body">
    <header>
        <div class="container header-content-admin">
            <div>
                <h1>Admin Panel</h1>
                <p>Manage your resume versions and content.</p>
            </div>
            <div class="header-actions">
                <button id="admin-theme-toggle" title="Toggle theme"><i class="fas fa-moon"></i></button>
                <button id="logout-btn" class="btn-danger">Logout</button>
            </div>
        </div>
    </header>

    <!-- Global Profile: always visible, full-width -->
    <section id="global-profile-section" class="admin-global-profile">
        <div class="global-profile-header">
            <h2><i class="fas fa-globe"></i> Global Profile <span class="header-badge">Shared across all versions</span></h2>
            <button id="save-profile-btn" class="btn-primary">Save Profile</button>
        </div>
        <form id="global-profile-form">
            <div class="global-profile-grid">
                <div class="form-group profile-pic-group">
                    <label>Profile Picture</label>
                    <input type="hidden" id="contact-profile_picture" name="profile_picture">
                    <div class="profile-pic-col">
                        <div id="current-profile-pic-preview" class="profile-pic-preview"></div>
                        <input type="file" id="contact-profile-pic" name="profile_pic" accept="image/*">
                    </div>
                </div>
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="contact-name" name="name" placeholder="Your Name">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="contact-email" name="email" placeholder="Email">
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="tel" id="contact-phone" name="phone" placeholder="Phone">
                </div>
                <div class="form-group">
                    <label>LinkedIn</label>
                    <input type="url" id="contact-linkedin" name="linkedin" placeholder="LinkedIn URL">
                </div>
                <div class="form-group">
                    <label>GitHub</label>
                    <input type="url" id="contact-github" name="github" placeholder="GitHub URL">
                </div>
                <div class="form-group">
                    <label>Website</label>
                    <input type="url" id="contact-website" name="website" placeholder="Website URL">
                </div>
            </div>
        </form>
    </section>

    <div class="admin-container">
        <!-- Left Column: Versions & Settings -->
        <aside class="admin-sidebar">
            <section id="versions-manager" class="sidebar-card">
                <div class="versions-card-header">
                    <h2>Resume Versions</h2>
                    <button id="versions-collapse-btn" class="btn-icon" title="Collapse list"><i class="fas fa-chevron-up"></i></button>
                </div>
                <div id="versions-body">
                    <div class="add-version-form">
                        <input type="text" id="new-version-name" placeholder="Create new version...">
                        <button id="add-version-btn" class="btn-primary">Add</button>
                    </div>
                    <div class="versions-search-wrap">
                        <i class="fas fa-search"></i>
                        <input type="text" id="versions-search" placeholder="Filter versions...">
                    </div>
                    <ul id="versions-list"></ul>
                </div>
            </section>

            <section id="version-settings-manager" class="sidebar-card hidden">
                <form id="version-settings-form">
                    <div class="settings-header">
                        <h3>Settings for <span id="current-version-name"></span></h3>
                        <button type="submit" class="btn-primary btn-sm">Save</button>
                    </div>

                    <div class="visibility-section">
                        <label class="section-label">Section Visibility</label>
                        <div class="visibility-grid">
                            <label><input type="checkbox" data-field="show_summary"> Summary</label>
                            <label><input type="checkbox" data-field="show_experience"> Experience</label>
                            <label><input type="checkbox" data-field="show_education"> Education</label>
                            <label><input type="checkbox" data-field="show_projects"> Projects</label>
                            <label><input type="checkbox" data-field="show_skills"> Skills</label>
                        </div>
                    </div>

                    <div class="settings-grid bilingual-titles">
                        <div class="lang-col">
                            <h4 class="lang-label"><span class="lang-tag lang-en">EN</span> English</h4>
                            <span class="field-label">Role Subtitle</span>
                            <input type="text" id="contact-subtitle" name="subtitle" placeholder="e.g. Project Manager">
                            <span class="field-label">Section Titles</span>
                            <input type="text" data-field="title_summary" placeholder="Summary">
                            <input type="text" data-field="title_experience" placeholder="Experience">
                            <input type="text" data-field="title_education" placeholder="Education">
                            <input type="text" data-field="title_projects" placeholder="Projects">
                            <input type="text" data-field="title_skills" placeholder="Skills">
                        </div>
                        <div class="lang-col">
                            <h4 class="lang-label"><span class="lang-tag lang-es">ES</span> Español</h4>
                            <span class="field-label">Subtítulo</span>
                            <input type="text" id="contact-subtitle_es" name="subtitle_es" placeholder="ej. Gerente de Proyectos">
                            <span class="field-label">Títulos de sección</span>
                            <input type="text" data-field="title_summary_es" placeholder="Resumen">
                            <input type="text" data-field="title_experience_es" placeholder="Experiencia">
                            <input type="text" data-field="title_education_es" placeholder="Educación">
                            <input type="text" data-field="title_projects_es" placeholder="Proyectos">
                            <input type="text" data-field="title_skills_es" placeholder="Habilidades">
                        </div>
                    </div>
                </form>
            </section>
        </aside>

        <!-- Right Column: Content Pools -->
        <main class="admin-main-content">
            <div id="tabs" class="tabs">
                <button class="tab-btn active" data-tab="experience">Experience</button>
                <button class="tab-btn" data-tab="education">Education</button>
                <button class="tab-btn" data-tab="project">Projects</button>
                <button class="tab-btn" data-tab="skill">Skills</button>
                <button class="tab-btn" data-tab="summary">Summary</button>
                <button class="tab-btn" data-tab="server">Server Info</button>
            </div>

            <div id="content-pool-container">
                <!-- Content for each tab will be dynamically inserted here -->
            </div>
        </main>
    </div>

    <!-- Modal for Adding/Editing Content Pool Items -->
    <div id="item-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h2 id="modal-title"></h2>
            <form id="modal-form"></form>
            <div class="modal-actions">
                <button id="modal-save-btn" class="btn-primary">Save</button>
                <button id="modal-cancel-btn" class="btn-secondary">Cancel</button>
            </div>
        </div>
    </div>

    <script src="admin-dashboard.js"></script>
</body>
</html>
